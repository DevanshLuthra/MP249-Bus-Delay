apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp249-api
  labels:
    app: mp249-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mp249-api
  template:
    metadata:
      labels:
        app: mp249-api
    spec:
      containers:
        - name: mp249-api
          image: mp249-api:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
